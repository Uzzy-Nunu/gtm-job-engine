name: Import jobs

# Pulls new jobs from the job boards into HubSpot (PRD §14 "pipeline" slot).
# Scheduled runs then qualify, research and draft (each step has its own switch).
on:
  schedule:
    - cron: "17 5 * * *"   # 06:17 Lagos (off the hour: GitHub delays or drops :00 runs)
    - cron: "17 13 * * *"  # 14:17 Lagos
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: read the boards but don't write to HubSpot"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hubspot-writes
  cancel-in-progress: false

jobs:
  import:
    # Scheduled runs only happen once the repository variable
    # ENABLE_SCHEDULED_IMPORT is set to "true" (Settings > Secrets and
    # variables > Actions > Variables). Manual runs always work.
    if: github.event_name != 'schedule' || vars.ENABLE_SCHEDULED_IMPORT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Import jobs
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          # Scheduled runs have no inputs, so they always run live.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/import_jobs.py --dry-run
          else
            python scripts/import_jobs.py
          fi
      # Scheduled runs then qualify and research what came in, once the
      # repository variable ENABLE_SCHEDULED_AI is "true". Runs even if one
      # job board failed during the import.
      - name: Qualify jobs
        if: always() && github.event_name == 'schedule' && vars.ENABLE_SCHEDULED_AI == 'true'
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          MASTER_CV: ${{ secrets.MASTER_CV }}
        run: python scripts/qualify_jobs.py
      - name: Research jobs
        if: always() && github.event_name == 'schedule' && vars.ENABLE_SCHEDULED_AI == 'true'
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/research_jobs.py
      # Drafting has its own switch: repository variable ENABLE_SCHEDULED_DRAFTS = "true".
      - name: Draft applications
        if: always() && github.event_name == 'schedule' && vars.ENABLE_SCHEDULED_AI == 'true' && vars.ENABLE_SCHEDULED_DRAFTS == 'true'
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          MASTER_CV: ${{ secrets.MASTER_CV }}
        run: python scripts/draft_jobs.py

      # Emails you a link to this run if a scheduled run failed (PRD OP-3).
      - name: Email an alert if this run failed
        if: failure() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
        run: python scripts/send_alert.py "Import jobs"
