# ------------------------------------------------------------------
# GTM Job Engine - configuration
# This file is public. Never put names, emails, keys or CV content here.
# Secrets live in GitHub Secrets / Cloudflare secrets (see docs/PRD.md §16).
# ------------------------------------------------------------------

# --- Roles we want -------------------------------------------------
# Built from the target titles in Peace's master CV (17 Nov 2026).
# Matching is by phrase: "AI Automation" also matches
# "AI Automation Specialist" and "Senior AI Automation Engineer".
target_titles:
  # GTM and growth engineering
  - GTM Engineer
  - Go-to-Market Engineer
  - GTM Engineering
  - Growth Engineer
  - Marketing Engineer
  - Marketing Automation
  - Growth Operations
  - GTM Operations
  - Revenue Operations
  - RevOps
  # AI operations and automation
  - AI Operations
  - AI Automation
  - AI Implementation
  - AI Enablement
  - AI Solutions            # e.g. AI Solutions Specialist / Consultant
  - AI Workflow
  - Workflow Automation
  - Automation Specialist

adjacent_titles:
  - Growth Marketing
  - Growth Manager          # also matches "Product Growth Manager"
  - Growth Lead
  - Growth Strategist
  - GTM Strategist
  - Go-to-Market Strategist
  - Marketing Operations
  - Marketing Ops
  - Growth Ops
  - Marketing Technology
  - MarTech
  - Lead Generation
  - Demand Generation
  - Demand Gen
  - Founder's Associate
  - Founders Associate
  - Chief of Staff          # early-stage only; the Qualify step checks
  - Founding Operator
  - Founding GTM

# Titles to explore: new directions that fit Peace's background, tried out
# without mixing them into the core lists above. They are imported after
# target and adjacent roles (so they never crowd them out of the daily cap),
# every deal says which list it matched, and each import summary counts
# matches per list. Promote a title that works to adjacent_titles; delete
# one that doesn't. Each one also becomes a Himalayas search, so keep the
# list short (about 10).
explore_titles:
  - Applied AI              # junior to mid only; many are ML engineering roles
  - AI Architect            # only when the role isn't senior engineering
  - CRM Manager
  - HubSpot                 # HubSpot Specialist / Administrator / Consultant
  - Implementation Specialist
  - Partnerships Manager
  - Business Operations
  - Customer Success        # CS Manager / Specialist / Operations (CX background)
  - CX Operations
  - Customer Experience Operations
  # Added 24 Nov 2026 after checking 79 company boards (Peace's choice)
  - AI Growth               # AI Growth Engineer / Lead
  - Head of Growth
  - Director of Growth
  - Growth Director
  - Product-Led Growth
  - GTM Enablement
  - Go-to-Market Enablement
  - GTM Strategy
  - Go-to-Market Strategy
  - GTM Strategic Planning
  - Revenue Enablement
  - Sales Enablement
  - Sales Operations
  - Sales Ops
  - Lifecycle Marketing
  - Performance Marketing
  - Performance Marketer
  - Product Marketing
  - Partner Marketing
  - Field Marketing
  - Solutions Engineer
  - Solutions Consultant
  - Solutions Manager
  - Implementation Consultant

# Titles that mean "clearly not a match" (hard filter, PRD §10.2 QU-2).
# These win over every list above.
excluded_title_words:
  - Account Executive
  - SDR
  - BDR
  - Sales Development
  - Software Engineer
  - Backend
  - Frontend
  - Data Scientist
  - Machine Learning Engineer
  - ML Engineer
  - QA                      # QA / test automation is a different field
  - Test Automation
  - Intern

# --- Where Peace can work from (hard filter + rubric) ----------------
# A job is kept if its remote scope is Worldwide, or a Region / Country
# that matches one of these words.
eligible_regions:
  - Worldwide
  - Anywhere
  - Global
  - EMEA
  - Africa
  - Nigeria
  - Europe time zones
  - CET
  - WAT

# --- Fit score rubric (PRD §11.3) ------------------------------------
fit_threshold: 60          # score >= this -> Qualified, else Archived (lowered from 70 on 24 Nov 2026)
qualify:
  # Jobs Peace captured herself (paste form, capture button) skip the score
  # threshold: they're still scored and still archived by the hard filters
  # (not remote, ineligible region, excluded title). Board imports use the threshold.
  hand_picked_sources: [LinkedIn Post, Company Site]

rubric:
  remote:
    worldwide: 30
    eligible_region: 20
    unclear: 10
  title:
    target_match: 25
    adjacent_match: 15
    explore_match: 10
  skills_tools_overlap_max: 20   # the AI's judgement of overlap with the master CV, 0-20
  seniority:
    points: 15
    preferred: [Entry, Mid]
    allowed_if_requirements_match: [Senior]
    senior_partial_points: 7     # Senior role, requirements not fully met (added 24 Nov 2026)
    unclear_points: 7            # seniority not stated
  salary_listed: 10

# --- Volume caps (Phase 1 -> Phase 2 values in comments) -------------
daily_import_cap: 100      # set for 15 applications a day (decision 17 Nov 2026)
daily_draft_cap: 20        # about 15 sent a day after review; lower it if drafts need too much editing
followup_after_days: 5
duplicate_window_days: 14  # same company + title within this many days = duplicate

# --- AI provider (PRD §11.1) -----------------------------------------
llm:
  provider: gemini                  # gemini | claude (key in the LLM_API_KEY secret)
  fast_model: gemini-3.5-flash-lite # reading and scoring jobs (stable, checked 17 Nov 2026)
  draft_model: gemini-3.8-flash     # CVs, cover letters, messages (M5)
  draft_backup_model: gemini-3.5-flash-lite  # used when the draft model stays busy (Gemini 503/429)
  # For Claude: provider: claude, fast_model: claude-haiku-5-5, draft_model: claude-sonnet-5-5,
  #   draft_backup_model: claude-haiku-5-5
  max_retries: 3
  retry_backoff_seconds: 20
  min_seconds_between_calls: 4      # keeps well inside free-tier per-minute limits
  max_ai_calls_per_run: 40          # leftover jobs wait for the next run

# --- Daily digest and alerts (PRD §10.6, §10.7) ----------------------
# Sent by Gmail to DIGEST_TO_EMAIL (GitHub Secrets). See docs/runbook.md > Email.
digest:
  follow_up_days: 5           # Applied deals with no update for this long are listed as follow-ups due

# --- HubSpot (PRD §9) ------------------------------------------------
hubspot:
  # Free CRM allows 10 custom properties in total. Raise on a paid plan.
  custom_property_limit: 10

