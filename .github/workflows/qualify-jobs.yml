name: Qualify jobs

# Manual for now: Actions > Qualify jobs > Run workflow.
# "preview" reads your New deals and asks the AI, but writes nothing.
# "live" renames, scores and moves deals to Qualified or Archived.
# (Milestone 4 part 3 adds it to the scheduled pipeline.)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = show results only (safe). live = update HubSpot."
        type: choice
        options: [preview, live]
        default: preview

permissions:
  contents: read

concurrency:
  group: hubspot-writes
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Qualify jobs (${{ inputs.mode }})
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          MASTER_CV: ${{ secrets.MASTER_CV }}
        run: |
          if [ "${{ inputs.mode }}" = "live" ]; then
            python scripts/qualify_jobs.py
          else
            python scripts/qualify_jobs.py --preview
          fi
