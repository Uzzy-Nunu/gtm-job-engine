name: Qualify, research and draft jobs

# Manual: Actions > Qualify, research and draft jobs > Run workflow.
# "preview" reads your deals and asks the AI, but writes nothing to HubSpot.
# "live" qualifies New deals, researches Qualified ones, then drafts the CV,
# cover letter and messages for Researched ones and moves them to Ready for Review.
# Tick "rescore" to re-score jobs that were archived for a low fit score (for
# example after a scoring change); hard-filtered and hand-archived jobs are left alone.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = show results only (safe). live = update HubSpot."
        type: choice
        options: [preview, live]
        default: preview
      rescore:
        description: "Re-score jobs archived for a low fit score (after scoring changes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hubspot-writes
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      MASTER_CV: ${{ secrets.MASTER_CV }}
      MODE_FLAG: ${{ inputs.mode == 'live' && ' ' || '--preview' }}
      RESCORE_FLAG: ${{ inputs.rescore && '--rescore-archived' || ' ' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Qualify jobs (${{ inputs.mode }})
        run: python scripts/qualify_jobs.py $MODE_FLAG $RESCORE_FLAG
      - name: Research jobs (${{ inputs.mode }})
        if: always()
        run: python scripts/research_jobs.py $MODE_FLAG
      - name: Draft applications (${{ inputs.mode }})
        if: always()
        run: python scripts/draft_jobs.py $MODE_FLAG
