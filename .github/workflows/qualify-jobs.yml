name: Qualify and research jobs

# Manual: Actions > Qualify and research jobs > Run workflow.
# "preview" reads your deals and asks the AI, but writes nothing.
# "live" qualifies New deals, then researches Qualified ones.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = show results only (safe). live = update HubSpot."
        type: choice
        options: [preview, live]
        default: preview

permissions:
  contents: read

concurrency:
  group: hubspot-writes
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      MASTER_CV: ${{ secrets.MASTER_CV }}
      MODE_FLAG: ${{ inputs.mode == 'live' && ' ' || '--preview' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Qualify jobs (${{ inputs.mode }})
        run: python scripts/qualify_jobs.py $MODE_FLAG
      - name: Research jobs (${{ inputs.mode }})
        if: always()
        run: python scripts/research_jobs.py $MODE_FLAG
